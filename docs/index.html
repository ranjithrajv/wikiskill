<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>WikiSkill — Harness-agnostic agent skill evolution</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta
      name="description"
      content="Compile agent experience into a persistent wiki — skills that evolve themselves."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/themes/vue.css" />
    <style>
      :root {
        --theme-color: #6c5ce7;
        --theme-color-dark: #a29bfe;
      }
      .sidebar .app-name {
        font-weight: 800;
      }
      .markdown-section h1 {
        font-weight: 900;
      }
      .markdown-section h2 {
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 0.3em;
      }
      .markdown-section code {
        background: rgba(108, 92, 231, 0.08);
        color: #6c5ce7;
      }
      .markdown-section pre {
        border-radius: 8px;
      }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 600;
        margin-right: 4px;
      }
      .badge-oc {
        background: #e3f2fd;
        color: #007acc;
      }
      .badge-cc {
        background: #fff3e0;
        color: #d97706;
      }
      .badge-cx {
        background: #f3e5f5;
        color: #7b1fa2;
      }
      .badge-pi {
        background: #e8f5e9;
        color: #10b981;
      }
      .badge-hx {
        background: #fff8e1;
        color: #f59e0b;
      }
    </style>
  </head>
  <body>
    <div id="app">Loading WikiSkill docs...</div>
    <script>
      window.$docsify = {
        name: "WikiSkill",
        repo: "ranjithrajv/wikiskill",
        loadSidebar: true,
        loadNavbar: true,
        subMaxLevel: 3,
        auto2top: true,
        coverpage: true,
        onlyCover: false,
        search: {
          maxAge: 86400000,
          paths: "auto",
          placeholder: "Search docs...",
          noData: "No results found.",
          depth: 3,
          hideOtherSidebarContent: false,
        },
        copyCode: {
          buttonText: "Copy",
          errorText: "Error",
          successText: "Copied!",
        },
        progress: {
          position: "top",
          color: "#6c5ce7",
        },
      };
    </script>
    <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  </body>
</html>
